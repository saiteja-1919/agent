# Alembic configuration for Veda.
#
# NOTE: sqlalchemy.url is intentionally ABSENT. The URL (which contains the
# database password) is injected at run time from validated settings by
# app/integrations/database/migrate.py, so no credential is ever written into a
# version-controlled file. Run migrations with:
#
#     python -m app.cli db upgrade
#
# which uses that injection.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
